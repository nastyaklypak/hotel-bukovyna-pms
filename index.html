<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hotel Bukovyna PMS Demo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Готель «Буковина» — PMS Demo</h1>
    <p>Навчальний прототип системи управління готелем</p>
  </header>

  <main>
    <section class="stats" id="stats"></section>

    <section>
      <div class="section-head">
        <h2>Номери</h2>
        <label>Статус:
          <select id="status-filter">
            <option value="all">Усі</option>
            <option value="free">Вільні</option>
            <option value="occupied">Зайняті</option>
            <option value="cleaning">Прибирання</option>
          </select>
        </label>
      </div>
      <table id="rooms-table">
        <thead>
          <tr><th>№</th><th>Тип</th><th>Ціна, грн/доба</th><th>Статус</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>

    <section>
      <h2>Бронювання</h2>
      <table id="bookings-table">
        <thead>
          <tr><th>ID</th><th>Гість</th><th>Номер</th><th>Заїзд</th><th>Виїзд</th><th>Ночей</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </section>
  </main>

  <footer>Hotel Bukovyna PMS Demo · навчальний проєкт</footer>
  <script src="script.js"></script>
</body>
</html>
